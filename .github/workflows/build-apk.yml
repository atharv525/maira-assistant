name: Build Maira APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK (preinstalled on runner)
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Version
        id: ver
        run: |
          CODE=$((100 + GITHUB_RUN_NUMBER))
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          printf 'versionCode=%s\nversionName=%s\ncommit=%s\n' "$CODE" "$NAME" "$GITHUB_SHA" > version.txt
          cat version.txt
      - name: Decrypt signing key
        env:
          MAIRA_SIGNING_PASS: ${{ secrets.MAIRA_SIGNING_PASS }}
        run: |
          if [ -z "$MAIRA_SIGNING_PASS" ]; then echo "::error::Secret MAIRA_SIGNING_PASS missing"; exit 1; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/maira-release.jks.enc -out signing/maira-release.jks -pass env:MAIRA_SIGNING_PASS
      - name: Build
        env:
          MAIRA_SIGNING_PASS: ${{ secrets.MAIRA_SIGNING_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/*.apk Maira.apk
          rm -f signing/maira-release.jks
      - uses: actions/upload-artifact@v4
        with:
          name: Maira-apk
          path: |
            Maira.apk
            version.txt
      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Maira v${{ steps.ver.outputs.name }} (build ${{ steps.ver.outputs.code }})
          body: |
            Automatic build from ${{ github.sha }}.
            versionCode=${{ steps.ver.outputs.code }}
            versionName=${{ steps.ver.outputs.name }}
          prerelease: false
          make_latest: true
          files: |
            Maira.apk
            version.txt
